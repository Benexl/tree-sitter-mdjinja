[package]
name = "tree-sitter-mdjinja"
description = "A tree-sitter grammar for the mdjinja language"
version = "1.0.0"
authors = ["benexl"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "mdjinja", "parsing", "tree-sitter"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "git@github.com:Benexl/tree-sitter-mdjinja.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25.1"

[build-dependencies]
cc = "1.2"
